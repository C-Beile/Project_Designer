[workspace]
resolver = "2"
# Wildcard membership: every P3 agent creates exactly one new directory under crates/
# and never edits this file. That keeps parallel agents from ever touching the same file.
# "cli/*" was re-added by the cli-forge integration agent once cli/forge/Cargo.toml existed
# (see RISKS.md R16: an empty cli/ directory matched by a glob with nothing inside it broke
# `cargo test`/`cargo check` workspace-wide, found by the plugin-api agent, 2026-09-21).
# "app/src-tauri" added explicitly (not a wildcard - P4's editor-entity agent owns exactly one
# app crate; see R16 for why an empty-glob wildcard is dangerous here) once the crate already
# existed, per the same "create crate first, then extend workspace root" guardrail cli-forge used.
members = ["crates/*", "cli/*", "app/src-tauri"]
exclude = ["vendor"]

# notify 6.1.1 with one patch: a Windows buffer overflow (0 bytes) becomes a `Flag::Rescan` event.
# See vendor/notify/src/windows.rs ("PATCH") and docs/index-watcher-plan.md (D2).
[patch.crates-io]
notify = { path = "vendor/notify" }

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Gemeinsame Versionen. In den Crates reicht `name = { workspace = true }`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
thiserror = "1"
tokio = "1"
toml = { version = "0.8", features = ["preserve_order"] }

# Shared lint policy for the whole workspace — kept intentionally light for P3, tightened later.
[workspace.lints.rust]
unsafe_code = "warn"
