[navigator]
module-hint = "hover"   # Wo die Herkunft (Modul und Version) steht. hover (beim Darüberfahren) | column (blasse Spalte) | off (nie)
module-mark = true      # Kleines Zeichen vor Artefakten, die aus einem Modul stammen. true | false

[motion]
duration-fast   = 100   # Dauer kurzer Übergänge wie Hover. Ganzzahl 0 bis 1000 (ms)
duration-normal = 200   # Dauer normaler Übergänge wie Einblenden. Ganzzahl 0 bis 1000 (ms)
focus-width     = 2     # Dicke des Fokus-Rings bei Tastaturbedienung. Ganzzahl 1 bis 4 (px)
