# Stil der Oberfläche. Überschreibt die Standards aus theme/tokens-primitives.css.
# Die Farben der Themes stehen in themes/*.theme.toml.

[radius]
window  = 6    # Rundung des Fensterrahmens von Dialogen und Panels. Ganzzahl 0 bis 16 (px)
control = 3    # Rundung von Buttons, Eingabefeldern und Umschaltern. Ganzzahl 0 bis 16 (px)
tab     = 4    # Rundung der oberen Tab-Ecken. Ganzzahl 0 bis 16 (px)
box     = 3    # Rundung von Boxen, z. B. der Diagramm-Box. Ganzzahl 0 bis 16 (px)
badge   = 2    # Rundung kleiner Zähler, z. B. bei Problems. Ganzzahl 0 bis 16 (px)

[font]
ident = "ibm-plex-mono"   # Standard-Schrift für Bezeichner (Feldnamen, Werte). ibm-plex-mono | jetbrains-mono | source-code-pro | fira-code | consolas
code  = "ibm-plex-mono"   # Standard-Schrift für Code-Editoren. Gleiche Auswahl wie ident

[size]
control-h     = 24   # Höhe von Buttons und Eingabefeldern. Ganzzahl 16 bis 40 (px)
row-h         = 24   # Höhe einer Zeile in Listen und Bäumen. Ganzzahl 16 bis 40 (px)
tab-h         = 28   # Höhe eines Tabs. Ganzzahl 20 bis 48 (px)
compact-row-h = 20   # Zeilenhöhe, wenn die Dichte auf compact steht. Ganzzahl 16 bis 40 (px)
icon-sm       = 12   # Größe kleiner Icons, z. B. Pfeile. Ganzzahl 8 bis 24 (px)
icon-md       = 16   # Standard-Größe der Icons. Ganzzahl 8 bis 32 (px)
icon-lg       = 20   # Größe großer Icons. Ganzzahl 12 bis 40 (px)

# Icons. Zuerst die Grundwerte je Bereich, danach Einzel-Icons als [icon.<name>].
# Ein Einzel-Icon gewinnt gegen den Bereich. Nicht gesetzte Werte erbt es vom Bereich.
# Alle Werte eines Icons: name, style, thickness, color.

[icons.toolbar]
style     = "fill"      # Grundstil der Aktionsleiste. line (Linie) | fill (gefüllt) | duotone (zweifarbig)
thickness = "regular"   # Linienstärke bei line und duotone. thin | light | regular | bold. Bei fill ohne Wirkung
color     = "text"      # Farbe. text (Textfarbe des Themes) | muted (blasser) | accent | accent-2 | cool | warm | success | warning | danger (Farben des Themes) | Hex wie #4aa8e8

[icons.tree]
style     = "fill"      # Grundstil der Typ-Icons im Baum. line | fill | duotone
thickness = "regular"   # Linienstärke. thin | light | regular | bold
color     = "text"      # Farbe, wenn ein Typ keine eigene hat. text | muted | accent | Hex

[icons.control]
style     = "line"      # Grundstil von Pfeilen, Plus, Minus und Schließen. line | fill | duotone
thickness = "bold"      # Linienstärke. thin | light | regular | bold
color     = "muted"     # Farbe. text | muted | accent | Hex

# Beispiel mit allen Werten eines Icons (zum Ausprobieren die Rauten entfernen):
# [icon.open-project]
# name      = "folder-open"   # Icon aus Phosphor (phosphoricons.com). Weglassen = Standard-Icon des Knopfes
# style     = "line"          # line (Linie) | fill (gefüllt) | duotone (zweifarbig)
# thickness = "bold"          # thin | light | regular | bold, nur bei line und duotone
# color     = "#e0b46a"       # text | muted | accent | Hex. Weglassen = Farbe des Bereichs

# Toolbar-Icons. Name = Befehl des Knopfes. Die Farben stammen aus dem Theme und passen sich ihm an.
# Nicht genannte Knöpfe (Zurück, Vor, Rückgängig, Wiederholen) folgen [icons.toolbar].
