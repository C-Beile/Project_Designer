[theme]
name = "Lion in der City"
id = "lion"
kind = "dark"                       # dark | light
author = "Lion"

[surface]
base = "#2b2b2b"                    # Hauptfläche, Editor
raised = "#303030"                  # Menüs, Dialoge, Popover
panel = "#353535"                   # Seitenflächen, aktiver Tab
inset = "#262626"                   # vertieft oder inaktiv
titlebar = "#1f1f1f"
titlebar-inactive = "#1a1a1a"

[text]
primary = "#d4d4d4"
muted = "#9a9a9a"
comment = "#8a8a8a"
titlebar = "#e0e0e0"
titlebar-inactive = "#8f8f8f"

[border]
subtle = "#4a4a4a"
strong = "#8a8a8a"
focus = "#4aa8e8"

[accent]
primary = "#4aa8e8"
secondary = "#b48fd8"
warm = "#e0b46a"
cool = "#5cc8c0"

[state]
error = "#ff6b68"
warning = "#e6b422"
success = "#49d249"

[selection]
background = "#2a78b4"              # Hintergrund einer Auswahl
text = "#ffffff"                    # Text einer Auswahl
row = "#2a78b4"                     # gewählte Zeile in Listen und Properties

[button.primary]
background = "#2a78b4"
text = "#ffffff"

[editor]
background = "#2b2b2b"
foreground = "#d4d4d4"
selection = "#2a78b4"
line-highlight = "#323232"
cursor = "#4aa8e8"
line-number = "#8a8a8a"
line-number-active = "#d4d4d4"

[editor.syntax]
keyword = "#569cd6"
string = "#ce9178"
number = "#b5cea8"
comment = "#8a8a8a"
function = "#dcdcaa"
type = "#4ec9b0"
variable = "#9cdcfe"
constant = "#4fc1ff"
identifier = "#d4d4d4"
operator = "#d4d4d4"
delimiter = "#d4d4d4"
