[package]
name = "forge-app"
version = "0.1.0"
description = "Forge - ADITO Designer rebuild, Tauri shell (architecture.md app/src-tauri)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# R13: no `cdylib` here on purpose - GNU/MinGW `ld` hits "export ordinal too large" on the full
# windows-rs dependency chain with Tauri's default mobile-oriented crate-type list. See
# spike-editor.md and RISKS.md R13.
[lib]
name = "forge_app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge-core = { path = "../../crates/forge-core" }
# All framework-agnostic logic (tree scan, wire format, undo history, validators, action
# dispatch) lives in this sibling crate specifically so it never links tauri/wry/webview2-com -
# see forge-app-core's lib.rs doc for why (GNU-toolchain test-binary DLL issue, candidate R22).
# This crate itself stays a genuinely thin Tauri command/event adapter with no tests of its own.
forge-app-core = { path = "../core" }
# P7 (project-open-dialog): the native folder-picker dialog for "Projekt oeffnen" reuses the
# already-built `platform::FileDialog` trait (Windows impl via `rfd`) rather than pulling in
# Tauri's own dialog plugin - one native-dialog seam for the whole app, not two.
platform = { path = "../../crates/platform" }

[lints]
workspace = true
