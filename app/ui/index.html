<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dito Designer</title>
    <script>
      // Theme sofort setzen, noch vor dem ersten Zeichnen. Sonst sieht man kurz das falsche Theme,
      // bis React läuft. Die Farben müssen zu --bg in theme/tokens.css passen.
      try {
        var t = localStorage.getItem('forge.theme')
        if (t !== 'light' && t !== 'lion') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.background = { dark: '#011627', light: '#fbfbfb', lion: '#2b2b2b' }[t]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
