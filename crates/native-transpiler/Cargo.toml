[package]
name = "differential-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "differential-harness"
path = "src/main.rs"

[dependencies]
transpiler = { path = "../transpiler" }
module-graph = { path = "../module-graph" }
aod-io = { path = "../aod-io" }
platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
semver = "1"

[lints]
workspace = true
