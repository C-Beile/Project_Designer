[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# Cross-platform backends: file watching (ReadDirectoryChangesW on Windows, FSEvents on macOS)
# and native file dialogs. Both are shared by platform::windows and platform::unix (macOS port).
notify = "6"
rfd = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[lints]
workspace = true
