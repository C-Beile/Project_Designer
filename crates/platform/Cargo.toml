[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# PuTTY .ppk keys are turned into OpenSSH keys so `ssh` (macOS, Linux, git) can use them.
base64 = "0.22"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519"] }

# Cross-platform backends: file watching (ReadDirectoryChangesW on Windows, FSEvents on macOS)
# and native file dialogs. Both are shared by platform::windows and platform::unix (macOS port).
notify = "6"
rfd = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[lints]
workspace = true
