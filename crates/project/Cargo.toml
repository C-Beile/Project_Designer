[package]
name = "forge-app-core"
version = "0.1.0"
description = "Forge app - framework-agnostic glue between forge-core and the Tauri shell (no tauri/wry/webview2 dependency, deliberately - see this crate's lib.rs doc)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forge-core = { path = "../../crates/forge-core" }
core-model = { path = "../../crates/core-model" }
aod-io = { path = "../../crates/aod-io" }
plugin-kernel = { path = "../../crates/plugin-kernel" }
# P7 (transpiler-selector): the two already-finished TranspilerRunner/OwnEngine
# implementations the "transpile" action chooses between (transpile_action.rs) - no new engine
# logic added here, this crate only adds the selection layer.
transpiler = { path = "../../crates/transpiler" }
differential-harness = { path = "../../crates/differential-harness" }
# P8 step 2: resolves the modules whose objects the project tree merges in.
module-graph = { path = "../../crates/module-graph" }
# Problems window: dangling references of the project objects (refs::extract).
refs = { path = "../../crates/refs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P8 step 3: reads the property catalog (XSD + annotation metadata) out of the locally installed
# Designer's jars at runtime - nothing ADITO-owned is shipped with Forge.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
# Services tab: SQL editor over the plink tunnel (db_session.rs) and basic Git (git_actions.rs).
db-layer = { path = "../../crates/db-layer" }
platform = { path = "../../crates/platform" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[lints]
workspace = true
