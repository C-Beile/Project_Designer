[package]
name = "project"
version = "0.1.0"
description = "Forge app - framework-agnostic glue between designer-core and the Tauri shell (no tauri/wry/webview2 dependency, deliberately - see this crate's lib.rs doc)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
designer-core = { path = "../../crates/designer-core" }
app-base = { path = "../../crates/app-base" }
aod = { path = "../../crates/aod" }
validators = { path = "../../crates/validators" }
plugin-api = { path = "../../crates/plugin-api" }
# Eigene Engine (immer da). Der offizielle Transpiler kommt nur ueber die plugin-api-Registry in die App.
native-transpiler = { path = "../../crates/native-transpiler", default-features = false }
# P8 step 2: resolves the modules whose objects the project tree merges in.
npm-modules = { path = "../../crates/npm-modules" }
# Problems window: dangling references of the project objects (refs::extract).
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# P8 step 3: reads the property catalog (XSD + annotation metadata) out of the locally installed
# Designer's jars at runtime - nothing ADITO-owned is shipped with Forge.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { workspace = true }
regex = "1"
platform = { path = "../../crates/platform" }
# Index ueber das Projekt (Dateien, Verweise, Probleme); `problems.rs` nutzt seine Analyse, `layout` stammt von dort.
project-index = { path = "../../crates/project-index" }

# Nur Beispiele (examples/db_live, deploy_*) nutzen die Plugin-Crates; der Kern selbst haengt nicht von ihnen ab.
[dev-dependencies]
git = { path = "../../crates/git" }
database = { path = "../../crates/database" }
deploy = { path = "../../crates/deploy" }
# Der Test transpile_action_real meldet den offiziellen Transpiler an, wie es die App beim Start tut.
adito-transpiler = { path = "../../crates/adito-transpiler" }

[lints]
workspace = true
