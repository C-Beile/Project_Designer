[package]
name = "qa-corpus-roundtrip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# P7 qa-integrator: full-corpus round-trip proof (Chef-Prompt §7 point 3).
# Read-only against GitRepos_ADITO (only fs::read, never fs::write there) — walks every
# real ADITO project, runs aod-io's parse/serialize round-trip on every .aod file found,
# reports per-project pass/fail counts plus a diagnosis for any mismatch.

[dependencies]
aod-io = { path = "../aod-io" }
walkdir = "2"

[lints]
workspace = true
