[package]
name = "ssh-tunnel"
version = "0.1.0"
description = "SSH-Tunnel in-process (russh): Einträge, Schlüssel, Sitzungen, Tunnel-Verwaltung"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
platform = { path = "../platform" }
app-base = { path = "../app-base" }
serde = { workspace = true }
quick-xml = { workspace = true }
plugin-api = { path = "../plugin-api" }
serde_json = { workspace = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[lints]
workspace = true
